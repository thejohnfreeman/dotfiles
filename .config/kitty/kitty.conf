# In this file's directory, ~/.config/kitty:
# git clone --depth 1 https://github.com/dexpota/kitty-themes.git
# ln -s ./kitty-themes/themes/Tomorrow_Night.conf theme.conf
include theme.conf

enable_audio_bell no
cursor_shape block
shell_integration no-cursor

# Forward these keybindings, which I bind in tmux.
# Kitty's default for these is previous/next tab.
map ctrl+shift+left  send_text all \x1b[1;6D
map ctrl+shift+right send_text all \x1b[1;6C
