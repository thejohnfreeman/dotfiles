# index windows and panes like vim tabs, next to `
set -g base-index 1
set -g pane-base-index 1

# space is our leader
unbind C-b
set -g prefix C-Space

bind r   source-file ~/.tmux.conf \; display 'reloaded'
bind C-r source-file ~/.tmux.conf \; display 'reloaded'

# use vi bindings
set -g mode-keys vi
# do not hold up vim
set -g escape-time 10

# make copy-mode similar to vim normal-mode
bind                Space   copy-mode \; send -X start-of-line
bind                C-Space copy-mode \; send -X start-of-line
bind -Tcopy-mode-vi v       send -X begin-selection
bind -Tcopy-mode-vi C-v     send -X rectangle-toggle

# Linux
bind -Tcopy-mode-vi y       send -X copy-pipe-and-cancel
bind                p       run 'xclip -out -selection primary | tmux load-buffer -; tmux paste-buffer -p'
set -g copy-command 'xclip -in -selection primary'

# Mac
# bind -Tcopy-mode-vi y       send -X copy-pipe-and-cancel
# bind                p       run 'pbpaste | tmux load-buffer -; tmux paste-buffer -p'
# set -g copy-command 'pbcopy'

# create panes
# https://superuser.com/a/1853485/333442
bind _ split-window -v -c '#{pane_current_path}' -l 25%
bind | split-window -h -c '#{pane_current_path}'

# create windows
bind t   break-pane
bind C-t break-pane

bind n   new-window -c '#{pane_current_path}'
bind C-n new-window -c '#{pane_current_path}'

# destroy panes
bind q   kill-pane
bind C-q kill-pane

# destroy windows
bind c   kill-window
bind C-c kill-window

# resize panes
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-h resize-pane -L 5
bind -r C-l resize-pane -R 5

# zoom pane
bind Enter resize-pane -Z

# swap panes
bind -n C-Up   swap-pane -U
bind -n C-Down swap-pane -D

# switch windows
bind -n C-Left  previous-window
bind -n C-Right next-window

# move windows
# https://superuser.com/a/552493/333442
bind -n C-S-Left swap-window -t -1 \; select-window -t -1
bind -n C-S-Right swap-window -t +1 \; select-window -t +1

# smart pane switching with awareness of vim splits
# 1. https://gist.github.com/mislav/5189704
# 2. https://robots.thoughtbot.com/seamlessly-navigate-vim-and-tmux-splits
# 3. http://www.codeography.com/2013/06/19/navigating-vim-and-tmux-splits
# 4. https://github.com/christoomey/vim-tmux-navigator
# is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind -Tcopy-mode-vi 'C-h' select-pane -L
bind -Tcopy-mode-vi 'C-j' select-pane -D
bind -Tcopy-mode-vi 'C-k' select-pane -U
bind -Tcopy-mode-vi 'C-l' select-pane -R
bind -Tcopy-mode-vi 'C-\' select-pane -l

# "suspend" a session
bind z   detach
bind C-z detach

set -g allow-passthrough  on
set -g default-terminal   'tmux-256color'
set -g default-command    "${SHELL}"
# Let Vim autoread know that window focus changed.
set -g focus-events       on
set -g history-limit      50000
set -g mouse              on
set -g set-titles         on
set -a terminal-features[10] ',xterm*:RGB'

set -g aggressive-resize on

set -g monitor-activity on
# just highlight the window name, no need to flash a message
set -g visual-activity off

set -g automatic-rename on
set -g automatic-rename-format '[#T #{pane_current_command}]'

# STATUS BAR

# Tomorrow Night theme.
set -g status-style                  'bg=#282a2e,fg=#c5c8c6'
set -g status-left                   '#[fg=#81a2be]#{host} '
set -g status-left-length            20
set -g status-right                  '#{?client_prefix,#[fg=#1d1f21 bg=#f0c674] Prefix #[default] ,}#[fg=#81a2be]%Y-%b-%d %H:%M'
set -g status-right-length           64
set -g window-style                  'bg=#1d1f21'
set -g window-status-current-style   'bg=#b294bb,fg=#1d1f21'
set -g window-status-activity-style  'fg=#de935f'
set -g message-style                 'bg=#373b41,fg=#c5c8c6'
set -g mode-style                    'bg=#373b41,fg=default'
set -g pane-border-style             'bg=#1d1f21,fg=#373b41'
set -g pane-active-border-style      'bg=#1d1f21,fg=#b5bd68'
